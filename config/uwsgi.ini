[uwsgi]

projectname = mysite
base = /home/testpress/blogs/mysite

master = true
virtualenv = /home/testpress/blogs/my_env
pythonpath = %(base)
chdir = %(base)

env = DJANGO_SETTINGS_MODULE=%(projectname).settings.pro
module = %(projectname).wsgi:application

socket = /tmp/%(projectname).sock
chmod-socket = 666
